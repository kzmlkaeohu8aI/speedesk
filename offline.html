<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101116" media="(prefers-color-scheme: dark)" />
  <title>Offline · Speedesk</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem("speedesk-theme");
        if (stored === "light" || stored === "dark" || stored === "system") {
          document.documentElement.setAttribute("data-theme", stored);
        } else {
          document.documentElement.setAttribute("data-theme", "system");
        }
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "system");
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
  />
  <link rel="stylesheet" href="./css/base.css" />
  <style>
    .offline-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }
    .offline-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .offline-text {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 340px;
    }
    .offline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 20px;
      border-radius: var(--r-md);
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="dark"] .offline-btn,
      :root[data-theme="system"] .offline-btn {
        color: #0b1210;
      }
    }
  </style>
</head>
<body>
  <div class="offline-shell">
    <h1 class="offline-title">You're offline.</h1>
    <p class="offline-text">
      This page isn't cached yet. Reconnect and try again.
    </p>
    <a class="offline-btn" href="./">Try again</a>
  </div>

  <script>
    window.addEventListener("online", () => {
      window.location.href = "./";
    });
  </script>
</body>
</html>
