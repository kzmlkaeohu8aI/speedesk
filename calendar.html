<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101116" media="(prefers-color-scheme: dark)" />
  <title>Calendar · Speedesk</title>
  <meta name="description" content="Speedesk — test calendar for Yakeen NEET 2.0 2027." />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem("speedesk-theme");
        if (stored === "light" || stored === "dark" || stored === "system") {
          document.documentElement.setAttribute("data-theme", stored);
        } else {
          document.documentElement.setAttribute("data-theme", "system");
        }
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "system");
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
  />

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/app-look.css" />
  <link rel="stylesheet" href="./css/calendar.css" />
</head>
<body>
  <div class="cal-shell">
    <header class="cal-header">
      <a class="icon-button" href="./" aria-label="Back to tests" title="Back">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </a>
      <div class="cal-header__titles">
        <h1 class="app-header__title">Calendar</h1>
        <p class="app-header__meta" id="cal-subtitle">Yakeen NEET 2.0 · 2027</p>
      </div>
      <a
        class="icon-button"
        href="./install.html"
        aria-label="Install Speedesk"
        title="Install"
        hidden
        id="install-link"
      >
        <span class="material-symbols-outlined" aria-hidden="true">download</span>
      </a>
      <div class="theme-switcher" role="group" aria-label="Theme">
        <button type="button" class="theme-switcher__btn" data-theme-choice="light" aria-label="Light theme" title="Light">
          <span class="material-symbols-outlined" aria-hidden="true">light_mode</span>
        </button>
        <button type="button" class="theme-switcher__btn" data-theme-choice="dark" aria-label="Dark theme" title="Dark">
          <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
        </button>
        <button type="button" class="theme-switcher__btn" data-theme-choice="system" aria-label="System theme" title="System">
          <span class="material-symbols-outlined" aria-hidden="true">contrast</span>
        </button>
      </div>
    </header>

    <main class="cal-main">
      <div class="cal-controls">
        <button type="button" class="icon-button" id="cal-prev" aria-label="Previous month">
          <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
        </button>
        <h2 class="cal-month" id="cal-month">Month Year</h2>
        <button type="button" class="icon-button" id="cal-next" aria-label="Next month">
          <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
        </button>
      </div>

      <div class="cal-weekdays" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>

      <div class="cal-grid" id="cal-grid" role="grid" aria-label="Test calendar"></div>

      <div class="cal-detail" id="cal-detail" hidden>
        <div class="cal-detail__header">
          <span class="cal-detail__date" id="cal-detail-date"></span>
          <button type="button" class="icon-button" id="cal-detail-close" aria-label="Close">
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
          </button>
        </div>
        <div class="cal-detail__list" id="cal-detail-list"></div>
      </div>
    </main>

    <div class="cal-skeleton" id="cal-skeleton">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>
  </div>

  <div class="cal-hover" id="cal-hover" hidden></div>


    <div class="reminder-scrim" id="reminder-scrim" hidden></div>
  <div
    class="reminder-modal"
    id="reminder-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="reminder-title"
    hidden
  >
    <div class="reminder-modal__header">
      <h2 class="reminder-modal__title" id="reminder-title">Add reminder</h2>
      <button
        type="button"
        class="icon-button"
        id="reminder-cancel-x"
        aria-label="Close reminder dialog"
      >
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
    </div>
    <div class="reminder-modal__body">
      <div class="reminder-row">
        <span class="reminder-label">Test</span>
        <div class="reminder-readonly" id="reminder-test-line"></div>
      </div>
      <div class="reminder-row">
        <span class="reminder-label">When</span>
        <div class="reminder-offsets" id="reminder-offsets"></div>
      </div>
      <div class="reminder-row">
        <span class="reminder-label">Note (optional)</span>
        <div class="reminder-note-wrap">
          <textarea
            id="reminder-note"
            class="reminder-note"
            rows="3"
            maxlength="200"
            placeholder="e.g. bring formula sheet, revise chapter 5 again"
          ></textarea>
          <span class="reminder-counter" id="reminder-counter">0 / 200</span>
        </div>
      </div>
    </div>
    <div class="reminder-modal__footer">
      <button type="button" class="btn btn--ghost" id="reminder-cancel">Cancel</button>
      <button type="button" class="btn btn--primary" id="reminder-confirm">
        Download .ics
      </button>
    </div>
  </div>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite" hidden>
    <span class="snackbar__text" id="snackbar-text"></span>
    <button type="button" class="snackbar__action" id="snackbar-action" hidden></button>
  </div>

  <script src="./js/config.js" defer></script>
  <script src="./js/app-look.js" defer></script>
<script src="./js/utils.js" defer></script>
<script src="./js/time.js" defer></script>
<script src="./js/data.js" defer></script>
<script src="./js/calendar.js" defer></script>
<script src="./js/reminder-modal.js" defer></script>
<script src="./js/calendar-page.js" defer></script>
    <script>
    (function () {
      var link = document.getElementById("install-link");
      if (!link) return;
      var standalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
      if (!standalone) link.hidden = false;
    })();
  </script>
</body>
</html>
